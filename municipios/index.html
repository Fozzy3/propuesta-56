<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riesgo municipal · Conv. 56</title>
<meta name="description" content="Ranking municipal de riesgo en los 16 departamentos de la Convocatoria 56, con variables de la UNGRD, IDEAM, SGC, USGS, DNP, INS y MinDefensa que se pueden prender y apagar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --bg: #eceae4; --panel: #fffdf9; --panel-2: #f6f4ef; --ink: #1b2126; --ink-2: #434c54; --muted: #5f6870; --line: #e0dbd0;
    --accent: #1f6f5c; --accent-2: #17594a; --accent-wash: #e5f0ec;
    --rojo: #c33d2a; --ambar: #c98a0e;
    --q0: #f1ece0; --q1: #ecd9a8; --q2: #e3b25f; --q3: #d5803a; --q4: #bb4a2a; --q5: #7d2a1b;
    --sombra: 0 10px 28px rgba(27, 33, 38, .14), 0 2px 6px rgba(27, 33, 38, .07);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 "IBM Plex Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  ::selection { background: var(--accent); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button, input, select { font: inherit; color: inherit; }
  * { scrollbar-width: thin; scrollbar-color: #c9c2b4 transparent; }
  a { color: var(--accent-2); text-underline-offset: 2px; }

  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  .tabs { display: inline-grid; grid-auto-flow: column; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; margin-left: auto; }
  .tabs button { border: 0; border-radius: 8px; padding: 6px 12px; background: transparent; font-weight: 600; cursor: pointer; color: var(--ink-2); }
  .tabs button[aria-selected=true] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(27, 33, 38, .14); }
  .btn { border: 0; border-radius: 9px; padding: 8px 12px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; background: var(--bg); color: var(--ink); white-space: nowrap; }
  .btn:hover { background: #e2ded5; }
  .btn.prim { background: var(--accent); color: #fff; }
  .btn.prim:hover { background: var(--accent-2); }
  .btn svg { flex: none; }

  main { display: grid; grid-template-columns: 330px 1fr; min-height: 0; }
  #panel { background: var(--panel-2); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 12px 40px; display: grid; gap: 14px; align-content: start; }
  #panel h2 { font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 9px; padding: 3px; gap: 3px; }
  .seg button { border: 0; border-radius: 7px; padding: 6px 8px; background: transparent; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--ink-2); line-height: 1.2; }
  .seg button[aria-pressed=true] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(27, 33, 38, .14); }
  details.grupo { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  details.grupo > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; font-weight: 600; }
  details.grupo > summary::-webkit-details-marker { display: none; }
  details.grupo > summary .cuenta { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 12.5px; }
  details.grupo > summary .flecha { transition: transform .15s; color: var(--muted); }
  details.grupo[open] > summary .flecha { transform: rotate(90deg); }
  .items { display: grid; padding: 0 10px 8px 10px; gap: 2px; }
  label.var { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: start; padding: 5px 4px; border-radius: 7px; cursor: pointer; }
  label.var:hover { background: var(--panel-2); }
  label.var small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 2px 0 0; }
  .dptos { display: grid; grid-template-columns: 1fr 1fr; gap: 0 6px; padding: 4px 10px 8px; }
  .dptos label { display: flex; gap: 6px; align-items: center; font-size: 13px; padding: 3px 0; cursor: pointer; }

  #centro { display: grid; grid-template-rows: minmax(260px, 52%) 1fr; min-height: 0; min-width: 0; }
  #vista-mapa { position: relative; min-height: 0; }
  #mapa { position: absolute; inset: 0; }
  .flota { position: absolute; z-index: 2; background: var(--panel); border-radius: 12px; box-shadow: var(--sombra); }
  #leyenda { left: 12px; bottom: 28px; padding: 9px 11px; font-size: 12.5px; display: grid; gap: 6px; }
  #leyenda .escala { display: grid; grid-template-columns: repeat(5, 30px); gap: 2px; }
  #leyenda .escala i { height: 10px; border-radius: 2px; }
  #leyenda .ext { display: flex; justify-content: space-between; color: var(--muted); }
  #leyenda .linea { display: flex; align-items: center; gap: 7px; color: var(--ink-2); }
  #leyenda .linea i { width: 18px; height: 0; border-top: 2.5px solid var(--accent); }
  #leyenda .linea i.pdf { border-top: 2px dashed var(--ink); }

  #ficha { right: 12px; top: 12px; bottom: 12px; width: 360px; overflow-y: auto; padding: 14px 16px; display: grid; gap: 10px; align-content: start; }
  #ficha h3 { margin: 0; font-size: 20px; letter-spacing: -.01em; line-height: 1.15; }
  #ficha .dp { color: var(--muted); }
  #ficha .cerrar { position: absolute; right: 8px; top: 8px; border: 0; background: transparent; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--muted); }
  #ficha .cerrar:hover { background: var(--bg); color: var(--ink); }
  .resumen { display: flex; gap: 18px; flex-wrap: wrap; }
  .resumen div { display: grid; }
  .resumen b { font-size: 20px; letter-spacing: -.02em; }
  .resumen span { font-size: 12px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--bg); color: var(--ink-2); white-space: nowrap; vertical-align: 1px; }
  .chip.sug { background: var(--accent-wash); color: var(--accent-2); }
  .chip.pdf { background: #ece6f3; color: #4b3a6b; }
  #ficha h4 { margin: 8px 0 2px; font-size: 12.5px; color: var(--muted); font-weight: 700; }
  .dato { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .dato .val { font-weight: 600; text-align: right; }
  .dato .barra { grid-column: 1 / -1; height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; }
  .dato .barra i { display: block; height: 100%; background: var(--q3); }
  .dato.off { color: var(--muted); }
  .dato.off .barra { display: none; }

  #abajo { display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--panel); border-top: 1px solid var(--line); }
  .barra-tabla { display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .barra-tabla input[type=search] { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 10px; width: 220px; }
  .barra-tabla .estado { color: var(--muted); font-size: 13px; }
  #sugeridos { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  .tabla-caja { overflow: auto; min-height: 0; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
  th { position: sticky; top: 0; background: var(--panel); z-index: 1; text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); padding: 0; white-space: nowrap; }
  th button { border: 0; background: transparent; padding: 7px 10px; font-weight: 600; color: inherit; cursor: pointer; width: 100%; text-align: inherit; }
  th button:hover { color: var(--ink); }
  th[aria-sort] button { color: var(--ink); }
  th.num, td.num { text-align: right; }
  td { padding: 6px 10px; border-bottom: 1px solid #efebe3; white-space: nowrap; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--panel-2); }
  tbody tr[aria-selected=true] td { background: var(--accent-wash); }
  td.punt { display: flex; align-items: center; gap: 8px; }
  td.punt i { display: block; height: 8px; border-radius: 2px; background: var(--q3); }
  td.punt b { min-width: 34px; text-align: right; }

  .hoja { overflow-y: auto; padding: 20px 24px 60px; background: var(--panel); }
  .hoja .col { max-width: 1050px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .hoja table { display: block; overflow-x: auto; }
  .hoja h2 { margin: 6px 0 0; font-size: 18px; }
  .hoja p, .hoja li { color: var(--ink-2); max-width: 75ch; }
  .hoja table td { white-space: normal; vertical-align: top; }
  .hoja p, .hoja ul { margin: 0; }
  .elegidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
  .elegido { border: 1px solid var(--line); border-top: 4px solid var(--q4); border-radius: 12px; padding: 14px; display: grid; gap: 10px; align-content: start; background: var(--panel); }
  .elegido header { display: flex; justify-content: space-between; gap: 10px; }
  .elegido h3 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .elegido .dp { color: var(--muted); font-size: 13px; }
  .elegido .rk { text-align: right; display: grid; }
  .elegido .rk b { font-size: 24px; line-height: 1; color: var(--q5); }
  .elegido .rk span { font-size: 12px; color: var(--muted); }
  .elegido .datos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .elegido .datos div { display: grid; background: var(--panel-2); border-radius: 8px; padding: 7px 9px; }
  .elegido .datos b { font-size: 17px; }
  .elegido .datos span { font-size: 12px; color: var(--muted); line-height: 1.25; }

  #cargando { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--bg); color: var(--ink-2); font-weight: 600; text-align: center; padding: 24px; }
  .maplibregl-ctrl-attrib { font-size: 11px; }

  @media (max-width: 900px) {
    body { overflow: auto; height: auto; }
    main { grid-template-columns: 1fr; }
    #panel { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
    #centro { grid-template-rows: 60vh auto; }
    #ficha { left: 8px; right: 8px; width: auto; top: auto; max-height: 55%; bottom: 8px; }
    .tabla-caja { max-height: 70vh; }
    .tabs { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Riesgo municipal · Convocatoria 56</h1>
    <div class="sub" id="sub">Cargando datos…</div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="ranking">Mapa y ranking</button>
    <button role="tab" aria-selected="false" data-tab="decision">Decisión</button>
  </div>
  <button class="btn prim" id="sugerir"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Sugerir 7 en 5 departamentos</button>
  <button class="btn" id="csv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Exportar CSV</button>
</header>

<main id="vista-ranking">
  <aside id="panel" aria-label="Universo y variables">
    <section>
      <h2>Municipios a comparar</h2>
      <div class="seg" id="presets">
        <button data-preset="todos" aria-pressed="true">16 departamentos</button>
        <button data-preset="foco" aria-pressed="false">Tolima, Huila y Eje Cafetero</button>
      </div>
      <details class="grupo" style="margin-top:8px">
        <summary><svg class="flecha" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>Departamentos<span class="cuenta" id="cuenta-dptos"></span></summary>
        <div class="dptos" id="dptos"></div>
      </details>
    </section>
    <section>
      <h2>Variables del índice</h2>
      <div class="seg" id="presets-vars" style="margin-bottom:8px">
        <button data-vars="proyecto" aria-pressed="false" title="Solo lo que el proyecto atiende: sismo, deslizamientos, lluvia y vulnerabilidad">Proyecto: lluvia y deslizamientos</button>
        <button data-vars="defecto" aria-pressed="false">Todas las relevantes</button>
      </div>
      <div id="familias" style="display:grid;gap:8px"></div>
    </section>
  </aside>

  <div id="centro">
    <div id="vista-mapa">
      <div id="mapa"></div>
      <div class="flota" id="leyenda">
        <b style="font-size:12.5px">Puntaje de riesgo</b>
        <div class="escala"><i style="background:var(--q1)"></i><i style="background:var(--q2)"></i><i style="background:var(--q3)"></i><i style="background:var(--q4)"></i><i style="background:var(--q5)"></i></div>
        <div class="ext"><span>quintil más bajo</span><span>más alto</span></div>
        <div class="linea"><i></i>Sugeridos</div>
        <div class="linea"><i class="pdf"></i>Municipios del PDF</div>
      </div>
      <aside class="flota" id="ficha" hidden aria-live="polite"></aside>
    </div>
    <section id="abajo">
      <div class="barra-tabla">
        <input type="search" id="buscar" placeholder="Buscar municipio o departamento" aria-label="Buscar municipio o departamento">
        <span class="estado" id="estado"></span>
        <div id="sugeridos" hidden></div>
      </div>
      <div class="tabla-caja"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    </section>
  </div>
</main>

<section id="decision" class="hoja" hidden><div class="col" id="decision-col"></div></section>
<div id="cargando">Cargando datos…</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
